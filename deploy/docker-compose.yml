# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Interpolated from --env-file backend/.env (same as MYRI_DOMAIN below).
        # Frontend build-time config - see the "Frontend build" block in
        # backend/.env.example.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_PROMPT_VERSION: ${VITE_PROMPT_VERSION:-}
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - myri-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # set MYRI_DOMAIN in backend/.env (e.g. myri.example.org)
      MYRI_DOMAIN: ${MYRI_DOMAIN:?set MYRI_DOMAIN in backend/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  myri-data:
  caddy-data:
  caddy-config:
